<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lieferkarte Karlsruhe – Restaurants mit eigenem Lieferservice</title>
  <meta name="description" content="Restaurants in Karlsruhe mit eigenem Lieferservice – direkt bestellen, ohne Provisions-Plattformen. Keine Cookies, kein Tracking.">

  <!-- PWA: installierbar („zum Homescreen hinzufügen"), offline nutzbar.
       Gecacht wird nur im Browser – kein Tracking, keine Datenübertragung. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#d64541">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iOS kennt kein Manifest-`display` – dort steuern diese Meta-Tags den
       Vollbildmodus und den Namen unter dem Homescreen-Icon. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lieferkarte">

  <!-- Leaflet (Kartenbibliothek, BSD-2-Clause) -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <style>
    :root {
      --bg: #f7f7f5;
      --panel: #ffffff;
      --accent: #d64541;
      --text: #1e1e1e;
      --muted: #6b6b6b;
      --ok: #2e8b4f;
      --border: #e3e3df;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
      flex: 0 0 auto;
    }
    header h1 {
      font-size: 1.15rem;
      margin: 0 0 0.15rem;
    }
    header h1 .accent { color: var(--accent); }
    header .sub { font-size: 0.8rem; color: var(--muted); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.5rem;
    }
    .controls input[type="search"] {
      flex: 1 1 200px;
      min-width: 140px;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }
    /* Filter-Chips statt Checkboxen: ein Tipp pro Filter, der aktive Zustand
       ist ohne Häkchen erkennbar (Farbe + aria-pressed für Screenreader). */
    .controls .chip {
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
      white-space: nowrap;
    }
    .controls .chip:hover { background: #f0f0ee; }
    .controls .chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .controls .chip[aria-pressed="true"]:hover { background: #c23b37; }
    .controls .chip-reset {
      border-style: dashed;
      color: var(--muted);
    }
    .controls button,
    .controls select {
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
      max-width: 14rem;
    }
    .controls button:hover { background: #f0f0ee; }
    .controls button[aria-expanded="true"] { background: #f0f0ee; border-color: var(--accent); }
    .controls .count { font-size: 0.85rem; color: var(--muted); margin-left: auto; }
    .pill {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0 0.35rem;
      margin-left: 0.25rem;
    }
    #map { flex: 1 1 auto; }

    /* --- Änderungs-Feed („Diese Woche neu …") --- */
    #feed[hidden] { display: none; }
    #feed {
      position: fixed;
      z-index: 900;            /* über den Leaflet-Panes/Controls */
      top: auto; right: 0.75rem; bottom: 2.2rem;
      width: min(23rem, calc(100vw - 1.5rem));
      max-height: min(60vh, 34rem);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }
    .feed-head {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .feed-head h2 { font-size: 0.95rem; margin: 0; }
    .feed-head .range { font-size: 0.72rem; color: var(--muted); }
    .feed-close {
      margin-left: auto;
      border: 0; background: none; cursor: pointer;
      font-size: 1rem; color: var(--muted); line-height: 1;
      padding: 0 0.15rem;
    }
    .feed-body { overflow-y: auto; padding: 0.35rem 0.75rem 0.6rem; }
    .feed-group { margin-top: 0.5rem; }
    .feed-group h3 {
      font-size: 0.78rem;
      margin: 0 0 0.25rem;
      color: var(--muted);
      font-weight: 600;
    }
    .feed-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-radius: 6px;
      background: none;
      padding: 0.3rem 0.35rem;
      font: inherit;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
    }
    .feed-item:hover, .feed-item:focus-visible { background: var(--bg); }
    .feed-item .fname { font-weight: 600; }
    .feed-item .fmeta { display: block; font-size: 0.74rem; color: var(--muted); }
    .feed-item.inactive .fname { text-decoration: line-through; }
    .feed-more, .feed-empty, .feed-note {
      font-size: 0.74rem;
      color: var(--muted);
      margin: 0.2rem 0.35rem 0;
    }
    .feed-empty { margin: 0.6rem 0.35rem; }
    .feed-note { border-top: 1px solid var(--border); padding-top: 0.4rem; margin-top: 0.6rem; }
    /* Schmale Displays: über die ganze Breite, und höher – dort umbricht die
       Fußzeile auf zwei Zeilen und würde sonst verdeckt. */
    @media (max-width: 640px) {
      #feed {
        left: 0.5rem; right: 0.5rem; bottom: 4rem;
        width: auto;
        max-height: 55vh;
      }
    }
    /* Installations-Button: nur sichtbar, wenn Installieren möglich ist. */
    .controls button#install {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .controls button#install:hover { background: #fdf0ef; }
    /* Hinweisleiste unter dem Kopf: Update verfügbar, Offline-Datenstand,
       Installations-Anleitung für iOS. */
    .banner {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #fff8e6;
      border-bottom: 1px solid #f0e2bd;
      padding: 0.45rem 1rem;
      font-size: 0.82rem;
      color: #6b5a1f;
    }
    .banner[hidden] { display: none; }
    .banner .banner-text { flex: 1 1 auto; }
    .banner button {
      border: 1px solid #d9c68f;
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .banner button:hover { background: #fdf7e6; }
    .banner .banner-close {
      border: 0;
      background: none;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 0.2rem;
      color: #6b5a1f;
    }
    .banner .banner-close:hover { background: none; color: var(--accent); }
    /* Als installierte App: Platz für Statusleiste/Home-Indikator freihalten. */
    @media (display-mode: standalone) {
      header { padding-top: calc(0.6rem + env(safe-area-inset-top)); }
      footer { padding-bottom: calc(0.4rem + env(safe-area-inset-bottom)); }
    }
    .popup-name { font-weight: 600; font-size: 1rem; margin-bottom: 0.15rem; }
    .popup-addr { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.4rem; }
    .popup-cuisine { font-size: 0.82rem; color: var(--text); margin-bottom: 0.4rem; }
    .popup-cuisine .label { color: var(--muted); }
    .popup-hours {
      font-size: 0.82rem;
      color: var(--text);
      margin-top: 0.45rem;
      line-height: 1.35;
    }
    .popup-hours .label { color: var(--muted); display: block; margin-bottom: 0.25rem; }
    /* Zwei Spalten: Tage links, Zeiten rechts – eine Zeile pro Regel. */
    .hours-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 0.6rem;
      row-gap: 0.15rem;
    }
    .hours-grid .day { color: var(--muted); white-space: nowrap; }
    .hours-grid .time { font-variant-numeric: tabular-nums; }
    .hours-grid .time.closed { color: var(--accent); }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      margin-right: 0.3rem;
    }
    .badge-delivery { background: #e6f4ea; color: var(--ok); }
    .badge-nodelivery { background: #f4e6e6; color: var(--accent); }
    .badge-takeaway { background: #e7eefc; color: #2b5bb5; }
    .badge-status { background: #fff3cd; color: #856404; }
    .badge-open { background: #e6f4ea; color: var(--ok); }
    .badge-closed { background: #f4e6e6; color: var(--accent); }
    /* „unbekannt" ist ein eigener, bewusst blasser Zustand – es darf nie wie
       ein „nein" aussehen (siehe A-1). */
    .badge-unknown { background: #efefec; color: var(--muted); }
    .popup-link {
      display: inline-block;
      margin-top: 0.4rem;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .popup-link:hover { text-decoration: underline; }
    .meld { margin-top: 0.5rem; }
    .meld summary {
      cursor: pointer;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .meld-body { margin-top: 0.4rem; }
    .meld-text {
      font-size: 0.8rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.5rem;
      margin: 0 0 0.4rem;
    }
    .meld-hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.3rem; }
    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 0.4rem 1rem;
      font-size: 0.72rem;
      color: var(--muted);
      flex: 0 0 auto;
    }
    footer a { color: var(--muted); }
    .loading {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      font-size: 0.95rem; color: var(--muted);
      z-index: 500; pointer-events: none;
    }
    /* Leerzustand: der Standardfilter „liefert jetzt" kann nachts null Treffer
       haben. Dann darf die Karte nicht stumm leer bleiben, sondern muss den
       Weg zurück zu allen Restaurants anbieten. */
    #empty[hidden] { display: none; }
    #empty {
      position: absolute; inset: 0; display: flex;
      flex-direction: column; gap: 0.6rem;
      align-items: center; justify-content: center;
      text-align: center; padding: 1rem;
      z-index: 500; pointer-events: none;
    }
    #empty p {
      margin: 0;
      max-width: 22rem;
      font-size: 0.95rem;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    }
    #empty button {
      pointer-events: auto;
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍽️ Lieferkarte <span class="accent">Karlsruhe</span></h1>
    <div class="sub" id="meta">Restaurants mit eigenem Lieferservice – direkt bestellen, ohne Provisions-Plattformen.</div>
    <div class="controls">
      <input type="search" id="search" placeholder="Restaurant oder Adresse suchen …" autocomplete="off">
      <!-- Standardfilter „Liefert jetzt" = Lieferung + Jetzt geöffnet (A-1).
           Beide Chips bleiben einzeln schaltbar, damit auch „liefert, egal
           wann" und „hat jetzt offen, egal wie" möglich bleiben. -->
      <button type="button" class="chip" id="fDelivery" aria-pressed="true">🚴 Lieferung</button>
      <button type="button" class="chip" id="fTakeaway" aria-pressed="false">🥡 Abholung</button>
      <button type="button" class="chip" id="fOpen" aria-pressed="true">🕒 Jetzt geöffnet</button>
      <!-- Küchenstil-Filter: wird aus den Daten aufgebaut und bleibt versteckt,
           solange kein Restaurant einen cuisine-Tag hat. -->
      <select id="cuisine" aria-label="Nach Küchenstil filtern" hidden>
        <option value="">🍽️ Alle Küchen</option>
      </select>
      <button type="button" class="chip chip-reset" id="resetFilters" hidden>✕ Alle zeigen</button>
      <button id="nearMe" type="button">📍 In meiner Nähe</button>
      <button id="feedToggle" type="button" aria-expanded="false" aria-controls="feed" hidden>
        🆕 Diese Woche<span class="pill" id="feedPill" hidden></span>
      </button>
      <!-- Wird nur eingeblendet, wenn der Browser das Installieren anbietet
           (bzw. auf iOS, wo es die Anleitung dazu zeigt). -->
      <button id="install" type="button" hidden>📲 App installieren</button>
      <span class="count" id="count" role="status" aria-live="polite"></span>
    </div>
  </header>

  <div class="banner" id="banner" hidden>
    <span class="banner-text" id="bannerText"></span>
    <button type="button" id="bannerAction" hidden></button>
    <button type="button" class="banner-close" id="bannerClose" aria-label="Hinweis schließen" title="Hinweis schließen">×</button>
  </div>

  <div id="map">
    <div class="loading" id="loading">Lade Restaurants …</div>
    <div id="empty" hidden>
      <p id="emptyText"></p>
      <button type="button" id="emptyReset">Alle Restaurants zeigen</button>
    </div>
  </div>

  <aside id="feed" hidden aria-labelledby="feedTitle">
    <div class="feed-head">
      <h2 id="feedTitle">Diese Woche neu</h2>
      <span class="range" id="feedRange"></span>
      <button class="feed-close" id="feedClose" type="button" aria-label="Feed schließen">✕</button>
    </div>
    <div class="feed-body" id="feedBody"></div>
  </aside>

  <footer>
    Daten &amp; Karte: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende (ODbL) ·
    Keine Cookies, kein Tracking · <a href="datenschutz.html" target="_blank" rel="noopener">Datenschutz &amp; Hinweise</a>
  </footer>

  <script>
    const KA = [49.0069, 8.4037];

    const map = L.map("map", { zoomControl: true }).setView(KA, 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap-Mitwirkende",
    }).addTo(map);

    const layer = L.layerGroup().addTo(map);
    let restaurants = [];
    let feedItems = [];
    let meMarker = null;

    const $search = document.getElementById("search");
    const $fDelivery = document.getElementById("fDelivery");
    const $fTakeaway = document.getElementById("fTakeaway");
    const $fOpen = document.getElementById("fOpen");
    const $reset = document.getElementById("resetFilters");
    const $cuisine = document.getElementById("cuisine");
    const $count = document.getElementById("count");
    const $meta = document.getElementById("meta");
    const $loading = document.getElementById("loading");
    const $empty = document.getElementById("empty");
    const $emptyText = document.getElementById("emptyText");
    const $feed = document.getElementById("feed");
    const $feedToggle = document.getElementById("feedToggle");
    const $feedPill = document.getElementById("feedPill");
    const $feedRange = document.getElementById("feedRange");
    const $feedBody = document.getElementById("feedBody");

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // ---- Küchenstil (OSM-Tag `cuisine`) ----
    // Die Schlüssel kommen normalisiert aus der Pipeline (klein, "_" statt
    // Leerzeichen, mehrere Werte als Liste). Hier nur noch die deutschen
    // Bezeichnungen für die häufigen Werte; alles Unbekannte wird lesbar
    // aufbereitet (cuisineLabel), damit auch seltene Stile filterbar bleiben.
    const CUISINE_LABELS = {
      pizza: "Pizza", italian: "Italienisch", pasta: "Pasta",
      kebab: "Kebab & Döner", doner: "Döner", shawarma: "Shawarma",
      falafel: "Falafel", turkish: "Türkisch", arab: "Arabisch",
      lebanese: "Libanesisch", syrian: "Syrisch", persian: "Persisch",
      oriental: "Orientalisch", moroccan: "Marokkanisch",
      burger: "Burger", american: "Amerikanisch", steak_house: "Steakhaus",
      barbecue: "Grill & BBQ", chicken: "Hähnchen", wings: "Chicken Wings",
      hot_dog: "Hot Dog", sandwich: "Sandwich", bagel: "Bagel", wrap: "Wrap",
      german: "Deutsch", regional: "Regional", bavarian: "Bayerisch",
      swabian: "Schwäbisch", franconian: "Fränkisch", austrian: "Österreichisch",
      swiss: "Schweizerisch", schnitzel: "Schnitzel", sausage: "Wurst",
      currywurst: "Currywurst", potato: "Kartoffelgerichte",
      asian: "Asiatisch", chinese: "Chinesisch", thai: "Thailändisch",
      vietnamese: "Vietnamesisch", japanese: "Japanisch", sushi: "Sushi",
      ramen: "Ramen", korean: "Koreanisch", indian: "Indisch",
      pakistani: "Pakistanisch", curry: "Curry", noodle: "Nudelgerichte",
      indonesian: "Indonesisch", filipino: "Philippinisch",
      greek: "Griechisch", balkan: "Balkan", croatian: "Kroatisch",
      serbian: "Serbisch", bosnian: "Bosnisch", hungarian: "Ungarisch",
      polish: "Polnisch", russian: "Russisch", ukrainian: "Ukrainisch",
      spanish: "Spanisch", tapas: "Tapas", portuguese: "Portugiesisch",
      french: "Französisch", crepe: "Crêpes", mediterranean: "Mediterran",
      european: "Europäisch", international: "International", fusion: "Fusion",
      mexican: "Mexikanisch", tex_mex: "Tex-Mex",
      latin_american: "Lateinamerikanisch", brazilian: "Brasilianisch",
      argentinian: "Argentinisch", peruvian: "Peruanisch",
      african: "Afrikanisch", ethiopian: "Äthiopisch", egyptian: "Ägyptisch",
      caribbean: "Karibisch",
      fish: "Fisch", seafood: "Meeresfrüchte", fish_and_chips: "Fish & Chips",
      friture: "Pommes & Frittiertes", snack: "Snacks", buffet: "Buffet",
      salad: "Salate", soup: "Suppen", bowl: "Bowls", poke: "Poke Bowls",
      vegetarian: "Vegetarisch", vegan: "Vegan",
      breakfast: "Frühstück", brunch: "Brunch", cake: "Kuchen",
      dessert: "Dessert", ice_cream: "Eis", waffle: "Waffeln",
      donut: "Donuts", coffee_shop: "Café", tea: "Tee",
      bubble_tea: "Bubble Tea", juice: "Saft", beer: "Bier", wine: "Wein",
      pub: "Pub", bar: "Bar", local: "Lokale Küche",
    };

    // "ice_cream" -> "Ice Cream" als Rückfall für nicht übersetzte Werte.
    function cuisineLabel(key) {
      return CUISINE_LABELS[key] ||
        key.split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
    }

    function cuisinesOf(r) {
      return Array.isArray(r.cuisines) ? r.cuisines : [];
    }

    // Auswahlliste aus den tatsächlich vorhandenen Werten bauen (häufigste
    // zuerst, mit Anzahl). Ohne getaggte Küchenstile bleibt der Filter versteckt.
    function buildCuisineOptions() {
      const counts = new Map();
      for (const r of restaurants) {
        for (const key of cuisinesOf(r)) {
          counts.set(key, (counts.get(key) || 0) + 1);
        }
      }
      if (!counts.size) {
        $cuisine.hidden = true;
        return;
      }
      const entries = [...counts.entries()].sort((a, b) =>
        b[1] - a[1] || cuisineLabel(a[0]).localeCompare(cuisineLabel(b[0]), "de")
      );
      for (const [key, n] of entries) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = `${cuisineLabel(key)} (${n})`;
        $cuisine.appendChild(opt);
      }
      $cuisine.hidden = false;
    }

    // OSM-Wochentags-/Sonderkürzel -> deutsche Kürzel.
    const OSM_DAYS = {
      Mo: "Mo", Tu: "Di", We: "Mi", Th: "Do", Fr: "Fr", Sa: "Sa", Su: "So",
      PH: "Feiertags", SH: "Ferien"
    };
    const DAY_TOKEN = "Mo|Tu|We|Th|Fr|Sa|Su|PH|SH";
    // Eine Regel: Tages-Spec (Bereiche/Listen) + Rest bis zur nächsten Regel.
    // Regelgrenze = ";" oder "," direkt vor einem neuen Tageskürzel; Kommas
    // innerhalb von Tages- ("Fr,Sa") oder Zeitlisten ("11:00-14:00,17:00-…")
    // lösen keine Trennung aus, weil ihnen kein Tageskürzel folgt.
    const RULE_RE = new RegExp(
      "((?:" + DAY_TOKEN + ")(?:\\s*[-,]\\s*(?:" + DAY_TOKEN + "))*)" +  // Tage
      "\\s+([^;]+?)" +                                                    // Zeiten (lazy)
      "(?=\\s*[;,]\\s*(?:" + DAY_TOKEN + ")\\b|\\s*$)",                   // bis nächste Regel/Ende
      "g"
    );

    function germanizeDays(days) {
      // "Mo-Fr" -> "Mo–Fr", "Fr,Sa" -> "Fr, Sa", "So,PH" -> "So, Feiertags".
      return days
        .split(",").map(seg => seg.trim().split("-").map(d => OSM_DAYS[d] || d).join("–"))
        .join(", ");
    }
    function germanizeTimes(times) {
      const t = times.trim();
      if (/^(off|closed)$/i.test(t)) return { text: "geschlossen", closed: true };
      // "11:00-14:00,17:00-23:00" -> "11:00–14:00, 17:00–23:00".
      const text = t.split(",").map(seg => seg.trim().replace(/-/g, "–")).join(", ");
      return { text, closed: false };
    }

    // Rohes OSM-`opening_hours` in eine übersichtliche Tag/Zeit-Tabelle wandeln.
    // Bewusst KEINE "jetzt geöffnet"-Auswertung – das komplexe Parsen des Formats
    // (sunrise/sunset, Wochenregeln) ist ein eigener Schritt.
    function formatOpeningHours(raw) {
      // Umschließende Anführungszeichen/Whitespace aus unsauberen OSM-Werten entfernen.
      const s = String(raw).replace(/^["'\s]+|["'\s]+$/g, "");
      if (!s) return "";
      if (s === "24/7") {
        return `<div class="hours-grid"><span class="day">täglich</span>` +
               `<span class="time">durchgehend geöffnet</span></div>`;
      }
      // Ganzer Wert = geschlossen (z. B. "closed"/"off"), ohne Tagesangabe.
      if (/^(off|closed)$/i.test(s)) {
        return `<div class="hours-grid"><span class="day">zurzeit</span>` +
               `<span class="time closed">geschlossen</span></div>`;
      }
      const rows = [];
      let m;
      RULE_RE.lastIndex = 0;
      while ((m = RULE_RE.exec(s)) !== null) {
        const time = germanizeTimes(m[2]);
        rows.push(
          `<span class="day">${esc(germanizeDays(m[1]))}</span>` +
          `<span class="time${time.closed ? " closed" : ""}">${esc(time.text)}</span>`
        );
      }
      // Unerwartetes Format (z. B. Freitext „nach Vereinbarung", nur Uhrzeit):
      // lieber den Rohtext zeigen als nichts – mit leichter Kosmetik (dt. Kürzel,
      // Gedankenstrich), aber ohne zu interpretieren.
      if (!rows.length) {
        let p = esc(s).replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)\b/g, d => OSM_DAYS[d]);
        p = p.replace(/(\d{1,2}:\d{2})-(\d{1,2}:\d{2})/g, "$1–$2");
        return `<div class="hours-grid"><span class="day"></span><span class="time">${p}</span></div>`;
      }
      return `<div class="hours-grid">${rows.join("")}</div>`;
    }

    // ---- „Jetzt geöffnet" – clientseitige Auswertung von opening_hours ----
    // Bewusst konservativ: nur die häufigen Muster (Tagesbereiche/-listen,
    // Zeitintervalle, Über-Mitternacht, "off"/"closed", 24/7). Alles Unsichere
    // – offene Zeiten wie „18:30+", Monatsbereiche („May-Sep"), Freitext,
    // sunrise/sunset – ergibt bewusst `null` = „unbekannt", damit nie eine
    // falsche Aussage entsteht. Feiertage/Ferien (PH/SH) werden ignoriert
    // (ob heute Feiertag ist, lässt sich clientseitig nicht ermitteln).
    const DAY_NUM = { Mo: 1, Tu: 2, We: 3, Th: 4, Fr: 5, Sa: 6, Su: 7 };

    // Aktuelle Zeit in Europe/Berlin – unabhängig von der Zeitzone des Nutzers
    // und inkl. korrekter Sommer-/Winterzeit (über Intl). day: 1=Mo … 7=So.
    function berlinNow() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Europe/Berlin", weekday: "short",
        hour: "2-digit", minute: "2-digit", hour12: false,
      }).formatToParts(new Date());
      const p = {};
      for (const part of parts) p[part.type] = part.value;
      const WD = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
      const day = WD[p.weekday] || null;
      let hh = parseInt(p.hour, 10);
      if (hh === 24) hh = 0;
      return { day, minutes: hh * 60 + parseInt(p.minute, 10) };
    }

    function parseHM(t) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(t.trim());
      if (!m) return null;
      const h = +m[1], mi = +m[2];
      if (h > 24 || mi > 59) return null;
      return h * 60 + mi;
    }

    // Tages-Spec ("Mo-Fr,Su") -> Set{1..7}; "skip" wenn nur PH/SH; null bei Unbekanntem.
    function expandDays(spec) {
      const set = new Set();
      let sawReal = false;
      for (const seg of spec.split(",")) {
        const s = seg.trim();
        if (!s) continue;
        if (/^(PH|SH)$/.test(s)) continue; // Feiertag/Ferien -> nicht ermittelbar
        sawReal = true;
        const r = s.split("-").map(x => x.trim());
        if (r.length === 1) {
          const n = DAY_NUM[r[0]];
          if (!n) return null;
          set.add(n);
        } else if (r.length === 2) {
          const a = DAY_NUM[r[0]], b = DAY_NUM[r[1]];
          if (!a || !b) return null;
          let i = a; // ggf. über Sonntag hinweg (z. B. "We-Mo")
          for (let guard = 0; guard < 7; guard++) {
            set.add(i);
            if (i === b) break;
            i = (i % 7) + 1;
          }
        } else return null;
      }
      return sawReal ? set : "skip";
    }

    // Zeit-Spec ("12:00-14:00,18:00-23:00") -> [{s,e}]; "off"/"closed" -> [];
    // null bei allem Unklaren (offene Zeiten "18:30+", sunrise, …).
    // Ein einzelner Bereich darf einen angehängten Modifikator tragen:
    // "17:30-22:00 off"/"…closed" -> dieser Bereich geschlossen (fällt raus),
    // "…open" -> offen. Ein eingebetteter Freitext-Kommentar ("…") ist bewusst
    // NICHT abgedeckt -> solche Einträge bleiben „unbekannt" (kein Badge).
    function parseIntervals(spec) {
      const t = spec.trim();
      if (/^(off|closed)$/i.test(t)) return []; // an diesem Tag geschlossen
      const out = [];
      let sawSegment = false;
      for (const seg of t.split(",")) {
        const s = seg.trim();
        if (!s) continue;
        sawSegment = true;
        const m = /^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})(?:\s+(off|closed|open))?$/i.exec(s);
        if (!m) return null;
        if (/^(off|closed)$/i.test(m[3] || "")) continue; // Bereich explizit geschlossen
        const a = parseHM(m[1]), b = parseHM(m[2]);
        if (a == null || b == null) return null;
        out.push({ s: a, e: b });
      }
      // Bereiche erkannt (auch wenn alle "off" waren -> [] = geschlossen)?
      return sawSegment ? out : null;
    }

    // -> true (offen) | false (geschlossen) | null (unbekannt/nicht auswertbar).
    function openStateNow(raw) {
      const s = String(raw).replace(/^["'\s]+|["'\s]+$/g, "");
      if (!s) return null;
      if (s === "24/7") return true;
      if (/^(off|closed)$/i.test(s)) return false;

      const byDay = {}; // 1..7 -> [{s,e}] ; spätere Regel überschreibt frühere je Tag
      const hasDay = new RegExp("\\b(?:" + DAY_TOKEN + ")\\b").test(s);

      if (!hasDay) {
        // Kein Tageskürzel -> Zeitangabe gilt täglich.
        const iv = parseIntervals(s);
        if (iv == null) return null;
        for (let d = 1; d <= 7; d++) byDay[d] = iv;
      } else {
        const covered = new Array(s.length).fill(false);
        let any = false, m;
        RULE_RE.lastIndex = 0;
        while ((m = RULE_RE.exec(s)) !== null) {
          any = true;
          for (let i = m.index; i < m.index + m[0].length; i++) covered[i] = true;
          const days = expandDays(m[1]);
          if (days === null) return null;
          const iv = parseIntervals(m[2]);
          if (iv === null) return null;
          if (days === "skip") continue; // reine PH/SH-Regel
          for (const d of days) byDay[d] = iv;
        }
        if (!any) return null;
        // Bleibt zwischen den erkannten Regeln noch etwas Bedeutungstragendes übrig
        // (Ziffern, ein Tageskürzel, off/closed)? Dann lieber „unbekannt" melden,
        // statt aus einer Teil-Interpretation eine falsche Aussage abzuleiten.
        let rest = "";
        for (let i = 0; i < s.length; i++) if (!covered[i]) rest += s[i];
        if (/\d/.test(rest) || /off|closed/i.test(rest) ||
            new RegExp("\\b(?:" + DAY_TOKEN + ")\\b").test(rest)) return null;
      }

      const { day, minutes } = berlinNow();
      if (!day) return null;
      const prev = (day + 5) % 7 + 1; // Vortag (1..7)

      const openToday = (byDay[day] || []).some(({ s, e }) =>
        e > s ? (minutes >= s && minutes < e)  // normaler Bereich
              : (minutes >= s));               // über Mitternacht: ab s bis 24:00
      if (openToday) return true;

      // Über-Mitternacht-Ausläufer vom Vortag (z. B. Fr 20:00-04:00 -> Sa 02:00 offen).
      const spillover = (byDay[prev] || []).some(({ s, e }) => e < s && minutes < e);
      return spillover ? true : false;
    }

    // Baut einen fertigen Meldetext für eine OSM-Notiz.
    // Nennt den aktuell getaggten Ist-Wert, damit die Notiz sofort brauchbar ist.
    function meldeText(r) {
      const ist = [];
      if (r.delivery === true) ist.push("Lieferung (delivery) ist als „ja“ getaggt");
      else if (r.delivery === false) ist.push("Lieferung (delivery) ist als „nein“ getaggt");
      else ist.push("Lieferung (delivery) ist gar nicht getaggt");
      if (r.takeaway === true) ist.push("Abholung (takeaway) ist als „ja“ getaggt");
      else if (r.takeaway === false) ist.push("Abholung (takeaway) ist als „nein“ getaggt");
      else ist.push("Abholung (takeaway) ist gar nicht getaggt");

      const adr = r.address ? ", " + r.address : "";
      let t = `Lieferkarte Karlsruhe – mögliche falsche Angabe bei „${r.name}“${adr}. `;
      if (ist.length) t += "Aktuell: " + ist.join("; ") + ". ";
      t += "Nach meiner Kenntnis stimmt das nicht – bitte den korrekten Wert prüfen und eintragen. Danke!";
      return t;
    }

    // OSM-Notiz-Editor, punktgenau auf das Restaurant zentriert (kein Konto nötig).
    function osmNoteUrl(r) {
      return `https://www.openstreetmap.org/note/new#map=19/${r.lat}/${r.lng}&layers=N`;
    }

    function popupHtml(r) {
      let html = `<div class="popup-name">${esc(r.name)}</div>`;
      html += `<div class="popup-addr">${esc(r.address)}</div>`;
      const cuisines = cuisinesOf(r);
      if (cuisines.length) {
        html += `<div class="popup-cuisine"><span class="label">🍽️ Küche:</span> ` +
                `${esc(cuisines.map(cuisineLabel).join(", "))}</div>`;
      }
      // Lieferung und Abholung sind drei Zustände, nicht zwei: ja / nein /
      // unbekannt. 87 % der Restaurants sind in OSM nicht getaggt – das als
      // „nein" darzustellen wäre schlicht falsch (A-1).
      if (r.delivery === true) {
        html += `<span class="badge badge-delivery">✔ Lieferservice</span>`;
      } else if (r.delivery === false) {
        html += `<span class="badge badge-nodelivery">kein Lieferservice</span>`;
      } else {
        html += `<span class="badge badge-unknown">Lieferung unbekannt</span>`;
      }
      if (r.takeaway === true) {
        html += `<span class="badge badge-takeaway">🥡 Abholung</span>`;
      } else if (r.takeaway === false) {
        html += `<span class="badge badge-nodelivery">keine Abholung</span>`;
      } else {
        html += `<span class="badge badge-unknown">Abholung unbekannt</span>`;
      }
      if (r.businessStatus && r.businessStatus !== "OPERATIONAL") {
        const label = r.businessStatus === "CLOSED_TEMPORARILY"
          ? "vorübergehend geschlossen" : "dauerhaft geschlossen";
        html += `<span class="badge badge-status">${label}</span>`;
      }
      // „Jetzt geöffnet"-Badge nur, wenn die Öffnungszeiten eindeutig auswertbar
      // sind (true/false). Bei unbekannt (null) bewusst kein Badge.
      const open = r.openingHours ? openStateNow(r.openingHours) : null;
      if (open === true) {
        html += `<span class="badge badge-open">🟢 Jetzt geöffnet</span>`;
      } else if (open === false) {
        html += `<span class="badge badge-closed">🔴 Jetzt geschlossen</span>`;
      }
      const hours = r.openingHours ? formatOpeningHours(r.openingHours) : "";
      if (hours) {
        html += `<div class="popup-hours"><span class="label">🕒 Öffnungszeiten:</span>${hours}</div>`;
      }
      if (r.website) {
        html += `<br><a class="popup-link" href="${esc(r.website)}" target="_blank" rel="noopener">Zur Website &amp; bestellen →</a>`;
      }

      // Meldemöglichkeit: immer anzeigen. Der Text kann per URL nicht in die
      // OSM-Notiz vorbefüllt werden, deshalb kopieren wir ihn in die Zwischenablage
      // und öffnen den Notiz-Editor – Einfügen genügt dann.
      const meldung = meldeText(r);
      html += `<details class="meld">`;
      html += `<summary>⚑ Falsche Angabe melden</summary>`;
      html += `<div class="meld-body">`;
      html += `<p class="meld-text">${esc(meldung)}</p>`;
      html += `<a class="meld-copy popup-link" href="${esc(osmNoteUrl(r))}" target="_blank" rel="noopener" data-text="${esc(meldung)}">📋 Text kopieren &amp; OSM-Notiz öffnen</a>`;
      html += `<div class="meld-hint">Der Text wird kopiert – im OSM-Fenster nur noch einfügen (Strg/⌘ + V) und absenden. Kein Konto nötig.</div>`;
      html += `</div></details>`;

      return html;
    }

    // ---- Änderungs-Feed („Diese Woche neu …") ----
    // Quelle: `feed` aus restaurants.json (export.py) – die Änderungen der
    // letzten Tage aus der `changes`-Tabelle, ohne den Erstimport.
    const FEED_GROUPS = [
      { type: "NEW",               label: "🆕 Neu dabei" },
      { type: "REMOVED",           label: "❌ Nicht mehr in OpenStreetMap" },
      { type: "DELIVERY_CHANGED",  label: "🚚 Lieferung geändert" },
      { type: "TAKEAWAY_CHANGED",  label: "🥡 Abholung geändert" },
      { type: "ADDRESS_CHANGED",   label: "📍 Adresse geändert" },
      { type: "STATUS_CHANGED",    label: "ℹ️ Status geändert" },
    ];

    function fmtDate(iso) {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleDateString("de-DE",
        { day: "2-digit", month: "2-digit", year: "numeric" });
    }

    // Zweite Zeile eines Feed-Eintrags: bei Wert-Änderungen „alt → neu",
    // sonst die Adresse.
    function feedItemMeta(it) {
      const when = fmtDate(it.detectedAt);
      let what = it.address || "";
      if (it.type !== "NEW" && it.type !== "REMOVED" && (it.oldValue || it.newValue)) {
        what = `${it.oldValue || "unbekannt"} → ${it.newValue || "unbekannt"}`;
      }
      return [what, when].filter(Boolean).join(" · ");
    }

    function renderFeed(feed) {
      const items = (feed && feed.items) || [];
      const counts = (feed && feed.counts) || {};
      const total = feed && typeof feed.total === "number" ? feed.total : items.length;

      // Der Knopf erscheint erst, wenn es überhaupt einen Feed gibt.
      $feedToggle.hidden = false;
      if (counts.NEW) {
        $feedPill.hidden = false;
        $feedPill.textContent = counts.NEW;
        $feedPill.title = `${counts.NEW} neue Restaurants`;
      }
      if (feed && feed.since && feed.until) {
        const since = fmtDate(feed.since), until = fmtDate(feed.until);
        $feedRange.textContent = since && until ? `${since} – ${until}` : "";
      }

      if (!total) {
        $feedBody.innerHTML =
          `<p class="feed-empty">Seit dem letzten Scan gab es keine Änderungen in ` +
          `OpenStreetMap. Der nächste Scan läuft sonntags.</p>`;
        return;
      }

      // Gruppen in fester Reihenfolge; unbekannte Änderungsarten hinten dran.
      const known = FEED_GROUPS.map(g => g.type);
      const groups = FEED_GROUPS.concat(
        Object.keys(counts).filter(t => !known.includes(t)).map(t => ({ type: t, label: t }))
      );

      let html = "";
      for (const g of groups) {
        const list = items.filter(it => it.type === g.type);
        if (!list.length) continue;
        html += `<section class="feed-group"><h3>${esc(g.label)} (${counts[g.type] || list.length})</h3>`;
        for (const it of list) {
          const canJump = it.lat != null && it.lng != null;
          html +=
            `<button class="feed-item${it.active ? "" : " inactive"}" type="button"` +
            ` data-place="${esc(it.placeId)}"${canJump ? "" : " disabled"}>` +
            `<span class="fname">${esc(it.name)}</span>` +
            `<span class="fmeta">${esc(feedItemMeta(it))}</span></button>`;
        }
        const rest = (counts[g.type] || 0) - list.length;
        if (rest > 0) html += `<p class="feed-more">… und ${rest} weitere</p>`;
        html += `</section>`;
      }
      html += `<p class="feed-note">Grundlage sind die wöchentlichen ` +
              `OpenStreetMap-Scans – „neu" heißt: neu in OpenStreetMap erfasst, ` +
              `nicht zwangsläufig neu eröffnet.</p>`;
      $feedBody.innerHTML = html;
    }

    // Feed-Eintrag anspringen: Karte zentrieren und ein Popup öffnen – auch
    // wenn der Marker gerade weggefiltert ist (z. B. ohne delivery=yes) oder
    // das Restaurant nicht mehr gelistet ist.
    function focusPlace(placeId) {
      const item = (feedItems || []).find(it => it.placeId === placeId);
      const r = restaurants.find(x => x.placeId === placeId);
      const lat = r ? r.lat : (item && item.lat);
      const lng = r ? r.lng : (item && item.lng);
      if (lat == null || lng == null) return;
      map.setView([lat, lng], 17);
      const html = r
        ? popupHtml(r)
        : `<div class="popup-name">${esc(item.name)}</div>` +
          `<div class="popup-addr">${esc(item.address || "")}</div>` +
          `<span class="badge badge-status">nicht mehr in OpenStreetMap gelistet</span>`;
      L.popup({ maxWidth: 320 }).setLatLng([lat, lng]).setContent(html).openOn(map);
      // Auf schmalen Displays verdeckt das Panel die Karte – dann schließen.
      if (window.matchMedia("(max-width: 640px)").matches) setFeedOpen(false);
    }

    function setFeedOpen(open) {
      $feed.hidden = !open;
      $feedToggle.setAttribute("aria-expanded", open ? "true" : "false");
    }

    $feedToggle.addEventListener("click", () => setFeedOpen($feed.hidden));
    document.getElementById("feedClose").addEventListener("click", () => setFeedOpen(false));
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !$feed.hidden) setFeedOpen(false);
    });
    $feedBody.addEventListener("click", (e) => {
      const btn = e.target.closest(".feed-item");
      if (btn) focusPlace(btn.dataset.place);
    });

    // ---- Filterzustand ----------------------------------------------------
    // Standard ist „Liefert jetzt": Lieferung + Jetzt geöffnet (A-1). Das ist
    // bewusst ein enger Default – wer bestellen will, will jetzt bestellen.
    // Der Preis dafür sind wenige Treffer (nachts null), deshalb gibt es den
    // Leerzustand mit „Alle Restaurants zeigen" weiter unten.
    const FILTER_DEFAULTS = { delivery: true, takeaway: false, open: true };

    function chipOn($chip) {
      return $chip.getAttribute("aria-pressed") === "true";
    }

    function setChip($chip, on) {
      $chip.setAttribute("aria-pressed", on ? "true" : "false");
    }

    function currentFilters() {
      return {
        delivery: chipOn($fDelivery),
        takeaway: chipOn($fTakeaway),
        open: chipOn($fOpen),
      };
    }

    function anyFilterActive() {
      const f = currentFilters();
      return f.delivery || f.takeaway || f.open ||
             !!$cuisine.value || !!$search.value.trim();
    }

    // Alles zurück auf „nichts gefiltert" – bewusst *nicht* auf die Defaults,
    // denn genau die sind ja der Grund, warum die Karte leer wirken kann.
    function clearFilters() {
      setChip($fDelivery, false);
      setChip($fTakeaway, false);
      setChip($fOpen, false);
      $cuisine.value = "";
      $search.value = "";
      render();
    }

    function render() {
      const q = $search.value.trim().toLowerCase();
      const f = currentFilters();
      const cuisine = $cuisine.value;
      layer.clearLayers();
      let shown = 0;

      for (const r of restaurants) {
        if (r.lat == null || r.lng == null) continue;
        // Lieferung/Abholung: nur sicher getaggte Treffer. „unbekannt" (null)
        // ist kein Ja – es fällt bei aktivem Filter heraus, wird im Popup aber
        // ausdrücklich als unbekannt und nie als Nein ausgewiesen.
        if (f.delivery && r.delivery !== true) continue;
        if (f.takeaway && r.takeaway !== true) continue;
        // Filter „nur jetzt geöffnet": nur sicher offene zeigen (unbekannt fällt raus).
        if (f.open && !(r.openingHours && openStateNow(r.openingHours) === true)) continue;
        // Küchenstil: ungetaggte Restaurants fallen bei aktivem Filter heraus –
        // die Abdeckung ist lückenhaft, „unbekannt" ist kein Treffer.
        if (cuisine && !cuisinesOf(r).includes(cuisine)) continue;
        if (q) {
          // Küchenstil mitsuchen, damit „thai"/„Italienisch" auch über das
          // Suchfeld funktioniert – in Schlüssel- und Klartextform.
          const styles = cuisinesOf(r);
          const hay = ((r.name || "") + " " + (r.address || "") + " " +
                       styles.join(" ") + " " +
                       styles.map(cuisineLabel).join(" ")).toLowerCase();
          if (!hay.includes(q)) continue;
        }
        // Popup faul bauen (R7): ohne Filter sind das 883 Marker, und für jeden
        // vorab das komplette HTML samt openStateNow()-Parsing zu erzeugen war
        // der teuerste Teil von render(). Leaflet akzeptiert eine Funktion und
        // ruft sie erst beim Öffnen auf.
        L.marker([r.lat, r.lng]).bindPopup(() => popupHtml(r)).addTo(layer);
        shown++;
      }
      $count.textContent = `${shown} von ${restaurants.length} angezeigt`;
      $reset.hidden = !anyFilterActive();
      updateEmptyState(shown);
      writeUrlState();
    }

    // Leerzustand statt stumm leerer Karte. Tritt beim Standardfilter
    // regelmäßig auf – nachts liefert niemand.
    function updateEmptyState(shown) {
      if (shown > 0 || !restaurants.length) {
        $empty.hidden = true;
        return;
      }
      const f = currentFilters();
      $emptyText.textContent = (f.delivery && f.open)
        ? "Gerade liefert kein erfasstes Restaurant. Das heißt nicht, dass "
          + "nichts geöffnet hat – bei 87 % der Läden ist in OpenStreetMap "
          + "gar nicht hinterlegt, ob sie liefern."
        : "Keine Treffer für die gewählten Filter.";
      $empty.hidden = false;
    }

    function locateMe() {
      if (!navigator.geolocation) {
        alert("Geolocation wird von deinem Browser nicht unterstützt.");
        return;
      }
      // Position bleibt rein im Browser – wird nirgends gespeichert oder gesendet.
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const here = [pos.coords.latitude, pos.coords.longitude];
          map.setView(here, 14);
          if (meMarker) map.removeLayer(meMarker);
          meMarker = L.circleMarker(here, {
            radius: 8, color: "#d64541", fillColor: "#d64541", fillOpacity: 0.6,
          }).addTo(map).bindPopup("Dein Standort").openPopup();
        },
        () => alert("Standort konnte nicht ermittelt werden (Erlaubnis verweigert?)."),
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    document.getElementById("nearMe").addEventListener("click", locateMe);

    // Suche gedrosselt (R7): ohne aktive Filter durchläuft render() alle
    // Restaurants, das muss nicht bei jedem Tastendruck passieren.
    let searchTimer = null;
    $search.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(render, 150);
    });
    for (const $chip of [$fDelivery, $fTakeaway, $fOpen]) {
      $chip.addEventListener("click", () => {
        setChip($chip, !chipOn($chip));
        render();
      });
    }
    $cuisine.addEventListener("change", render);
    $reset.addEventListener("click", clearFilters);
    document.getElementById("emptyReset").addEventListener("click", clearFilters);

    // Meldelink: Text in die Zwischenablage kopieren, dann OSM-Notiz öffnen.
    // Kein preventDefault -> der Link öffnet den OSM-Editor wie gewohnt im neuen Tab.
    // Bleibt komplett clientseitig; es wird nichts gespeichert oder gesendet.
    document.addEventListener("click", (e) => {
      const a = e.target.closest(".meld-copy");
      if (!a) return;
      const text = a.dataset.text || "";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          a.textContent = "✔ kopiert – OSM öffnet …";
        }).catch(() => {
          // Fallback: Kopieren verweigert/nicht verfügbar – der Text steht
          // sichtbar im Popup und kann von Hand markiert werden.
        });
      }
    });

    // ---- Hinweisleiste (Update, Offline-Datenstand, Installations-Anleitung) ----
    const $banner = document.getElementById("banner");
    const $bannerText = document.getElementById("bannerText");
    const $bannerAction = document.getElementById("bannerAction");

    function showBanner(text, actionLabel, onAction) {
      $bannerText.textContent = text;
      if (actionLabel && onAction) {
        $bannerAction.textContent = actionLabel;
        $bannerAction.hidden = false;
        $bannerAction.onclick = onAction;
      } else {
        $bannerAction.hidden = true;
        $bannerAction.onclick = null;
      }
      $banner.hidden = false;
    }
    document.getElementById("bannerClose").addEventListener("click", () => {
      $banner.hidden = true;
    });

    // ---- Filter im URL-Zustand (A-8) -------------------------------------
    // Reine Query-Parameter, nichts wird gespeichert – das „keine Cookies"-
    // Versprechen bleibt unberührt. Geschrieben wird nur, was vom Standard
    // abweicht, damit geteilte Links kurz und lesbar bleiben:
    //   ?delivery=0&open=0        -> alle Restaurants
    //   ?delivery=0&takeaway=1    -> was jetzt zur Abholung offen hat
    //   ?cuisine=thai&q=lotus     -> Küchenstil und Suchtext
    // `nearby` und unbekannte Parameter bleiben unangetastet.
    const URL_CHIPS = [["delivery", $fDelivery], ["takeaway", $fTakeaway], ["open", $fOpen]];
    let urlStateReady = false;

    // Gibt den gewünschten Küchenstil zurück – der lässt sich erst setzen,
    // wenn buildCuisineOptions() die Optionen aus den Daten erzeugt hat.
    function readUrlState() {
      const p = new URLSearchParams(window.location.search);
      for (const [key, $chip] of URL_CHIPS) {
        const v = p.get(key);
        setChip($chip, v === "1" || v === "0" ? v === "1" : FILTER_DEFAULTS[key]);
      }
      if (p.get("q")) $search.value = p.get("q");
      return p.get("cuisine") || "";
    }

    function writeUrlState() {
      if (!urlStateReady) return;
      const p = new URLSearchParams(window.location.search);
      for (const key of ["delivery", "takeaway", "open", "cuisine", "q"]) p.delete(key);
      const f = currentFilters();
      for (const [key] of URL_CHIPS) {
        if (f[key] !== FILTER_DEFAULTS[key]) p.set(key, f[key] ? "1" : "0");
      }
      if ($cuisine.value) p.set("cuisine", $cuisine.value);
      if ($search.value.trim()) p.set("q", $search.value.trim());
      const qs = p.toString();
      history.replaceState(null, "", qs ? `?${qs}` : window.location.pathname);
    }

    // ---- Startparameter (App-Verknüpfungen aus dem Manifest, geteilte Links) ----
    const wantedCuisine = readUrlState();
    if (new URLSearchParams(window.location.search).get("nearby") === "1") locateMe();

    // ---- Restaurantdaten laden ----
    // `no-store`: kein HTTP-Cache. Ohne Netz antwortet der Service Worker mit
    // seiner Kopie und markiert das per Header – dann kommt der Offline-Hinweis.
    let fromCache = false;
    fetch("restaurants.json", { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        fromCache = res.headers.get("X-Lieferkarte-Cache") === "hit";
        return res.json();
      })
      .then(data => {
        restaurants = data.restaurants || [];
        feedItems = (data.feed && data.feed.items) || [];
        $loading.remove();
        buildCuisineOptions();
        // Erst jetzt existiert die Option – vorher würde die Zuweisung verpuffen.
        if (wantedCuisine) $cuisine.value = wantedCuisine;
        urlStateReady = true;
        // Älteres restaurants.json (noch ohne `feed`): Knopf bleibt versteckt.
        if (data.feed) renderFeed(data.feed);
        let when = null;
        if (data.lastScanAt) {
          const d = new Date(data.lastScanAt);
          when = isNaN(d) ? data.lastScanAt : d.toLocaleDateString("de-DE");
          $meta.textContent = `${data.count} Restaurants · zuletzt aktualisiert am ${when}`;
        }
        if (fromCache) {
          showBanner("📴 Offline – gespeicherte Daten" +
                     (when ? ` vom ${when}` : "") +
                     ". Sobald wieder Netz da ist, wird automatisch aktualisiert.");
        }
        render();
      })
      .catch(err => {
        $loading.textContent = "Konnte Restaurantdaten nicht laden (" + err.message + ").";
      });

    // ---- PWA: Service Worker + Installation ------------------------------
    // Der Service Worker cacht ausschließlich lokal im Browser (Karte, Icons,
    // Restaurantdaten) – kein Tracking, nichts wird übertragen. Details zur
    // Update-Strategie stehen in sw.js.
    const isStandalone = () =>
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if ("serviceWorker" in navigator) {
      let updateAccepted = false;

      // Nur nach einem bewusst angenommenen Update neu laden. Beim allerersten
      // Besuch übernimmt der Worker ebenfalls die Kontrolle (clients.claim) –
      // dann wäre ein Reload überflüssig und irritierend.
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (updateAccepted) window.location.reload();
      });

      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(reg => {
          const offerUpdate = (worker) => {
            showBanner("🔄 Neue Version verfügbar.", "Jetzt neu laden", () => {
              updateAccepted = true;
              $banner.hidden = true;
              worker.postMessage({ type: "SKIP_WAITING" });
            });
          };

          // Update lag schon bereit, als die Seite geladen wurde.
          if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);

          reg.addEventListener("updatefound", () => {
            const worker = reg.installing;
            if (!worker) return;
            worker.addEventListener("statechange", () => {
              // `controller` vorhanden = es gab schon eine Version, also ein
              // echtes Update (und nicht die Erstinstallation).
              if (worker.state === "installed" && navigator.serviceWorker.controller) {
                offerUpdate(worker);
              }
            });
          });

          // Bei der Rückkehr zur App nach Updates sehen – wichtig, weil eine
          // installierte App oft wochenlang nicht neu geladen wird, die Daten
          // aber wöchentlich neu sind.
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") reg.update().catch(() => {});
          });
        }).catch(() => {
          /* Ohne Service Worker funktioniert die Seite unverändert weiter. */
        });
      });
    }

    const $install = document.getElementById("install");
    let installPrompt = null;

    // Chrome/Edge/Android: eigener Button statt der unauffälligen Browserleiste.
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      installPrompt = e;
      if (!isStandalone()) $install.hidden = false;
    });

    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      $install.hidden = true;
    });

    // iOS/iPadOS-Safari kennt `beforeinstallprompt` nicht – dort gibt es nur
    // den manuellen Weg über das Teilen-Menü, also zeigen wir die Anleitung.
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isIOS && !isStandalone()) $install.hidden = false;

    $install.addEventListener("click", async () => {
      if (installPrompt) {
        installPrompt.prompt();
        const choice = await installPrompt.userChoice.catch(() => null);
        installPrompt = null;
        if (choice && choice.outcome === "accepted") $install.hidden = true;
        return;
      }
      showBanner("📲 Zum Homescreen hinzufügen: im Browser auf „Teilen“ tippen " +
                 "(Symbol ⬆) und dann „Zum Home-Bildschirm“ wählen.");
    });
  </script>
</body>
</html>
