<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lieferkarte Karlsruhe</title>
  <meta name="theme-color" content="#d64541">
  <link rel="icon" href="web/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="web/icons/apple-touch-icon.png">
  <!-- Weiterleitung zur Karte unter /web/. Hält die Projektstruktur (alles in web/)
       und sorgt dafür, dass die Startseite direkt die Karte zeigt. -->
  <meta http-equiv="refresh" content="0; url=web/index.html">
  <link rel="canonical" href="web/index.html">
  <script>window.location.replace("web/index.html");</script>
  <style>
    /* Farbrollen wie in web/index.html getrennt (A-4, ADR-009): der Link ist
       Interaktion, nicht Marke. Kein Farbwert außerhalb von :root. */
    :root {
      --bg: #f7f7f5;
      --text: #1e1e1e;
      --aktion: #b8352f;
    }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); display: flex; height: 100vh;
           margin: 0; align-items: center; justify-content: center; }
    a { color: var(--aktion); font-weight: 600; }
  </style>
</head>
<body>
  <p>Weiterleitung zur <a href="web/index.html">Lieferkarte Karlsruhe</a> …</p>
</body>
</html>
